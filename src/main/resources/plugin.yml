name: PBLobbyCore
version: 2.3
main: org.pablito.pBLobbyCore.PBLobbyCore
api-version: 1.16
authors: [Pablito]
description: A comprehensive lobby management plugin.
softdepend:
  - WorldGuard
  - CMI
  - Essentials
  - EssentialsSpawn
  - EssentialsChat
  - Multiverse-Core
  - AuthMe
  - CombatLogX
  - DeluxeCombat
  - AAC
  - Spartan
load: POSTWORLD

commands:
  pblcore:
    description: Admin commands for the plugin.
    usage: /pblcore <command>
    permission: pblcore.admin
    aliases: [pblc, lc]
  lock:
    description: Locks the global chat.
    permission: pblcore.chatlock.use
  unlock:
    description: Unlocks the global chat.
    permission: pblcore.chatlock.use
  announce:
    description: Send a global announce.
    usage: /<command> [message]
    permission: pblcore.command.announce
  broadcast:
    description: /announce Alias.
    usage: /<command> [message]
    permission: pblcore.command.announce
  pvp:
    description: Toggle your PvP state (opt-in)
    usage: /<command> [on|off|status]
    permission: pblcore.pvp
  pvpdiag:
    description: Shows damage listener order
    permission: pblcore.pvp.diag
  hideplayers:
    description: Enable/disable the hide players module.
    usage: /<command> <on|off|toggle|status>
    permission: pblcore.hideplayers.admin
  hidebypass:
    description: Enable/disable your hide players bypass (session-only).
    usage: /<command> <on|off|toggle|status>
    permission: pblcore.hideplayers.bypass.toggle
  weatherlock:
    description: Locks lobby weather and time to values defined in config.yml.
    usage: |
      /<command> <on|off|toggle|status>
      /<command> weather <clear|rain|thunder>
      /<command> time <day|sunset|night|sunrise>
    permission: pblcore.weatherlock.admin

permissions:
  pblcore.admin:
    description: Allows reloading the plugin.
    default: op
  pblcore.chatlock.use:
    description: Allows locking and unlocking the chat.
    default: op
  pblcore.chatlock.bypass:
    description: Allows speaking while chat is locked.
    default: op
  pblcore.pvp:
    default: true
  pblcore.pvp.bypass:
    default: op
  pblcore.pvp.diag:
    default: op
  pblcore.hideplayers.admin:
    description: Allows enabling/disabling the hide players module.
    default: op
  pblcore.hideplayers.bypass:
    description: Allows being eligible for bypass (see everyone / not be hidden) when enabled via command.
    default: op
  pblcore.hideplayers.bypass.toggle:
    description: Allows using /hidebypass.
    default: op
    children:
      pblcore.hideplayers.bypass: true
  pblcore.weatherlock.admin:
    description: Allows managing the WeatherLock module and its settings.
    default: op
