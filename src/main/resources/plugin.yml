name: PBLobbyCore
version: 2.0
main: org.pablito.pBLobbyCore.PBLobbyCore
api-version: 1.16
authors: [Pablito]
description: A lobby management plugin.
softdepend:
  - WorldGuard
  - CMI
  - Essentials
  - EssentialsSpawn
  - EssentialsChat
  - Multiverse-Core
  - AuthMe
  - CombatLogX
  - DeluxeCombat
  - AAC
  - Spartan
load: POSTWORLD

commands:
  pblcore:
    description: Comandos de administración para el plugin.
    usage: /pblcore <command>
    permission: pblcore.admin
    aliases: [pblc, lc]
  lock:
    description: Bloquea el chat globalmente.
    permission: pblcore.chatlock.use
  unlock:
    description: Desbloquea el chat globalmente.
    permission: pblcore.chatlock.use
  announce:
    description: Send a global announce.
    usage: /<command> [message]
    permission: pblcore.command.announce
  broadcast:
    description: /announce Alias.
    usage: /<command> [message]
    permission: pblcore.command.announce
  pvp:
    description: Alterna tu estado de PvP (opt-in)
    usage: /<command> [on|off|status]
    permission: pblcore.pvp
  pvpdiag:
    description: Muestra el orden de listeners de daño
    permission: pblcore.pvp.diag

permissions:
  pblcore.admin:
    description: Permite recargar el plugin.
    default: op
  pblcore.chatlock.use:
    description: Permite bloquear y desbloquear el chat.
    default: op
  pblcore.chatlock.bypass:
    description: Permite hablar en el chat aunque esté bloqueado.
    default: op
  pblcore.pvp:
    default: true
  pblcore.pvp.bypass:
    default: op
  pblcore.pvp.diag:
    default: op