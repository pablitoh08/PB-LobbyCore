name: PBLobbyCore
version: 2.1.1
main: org.pablito.pBLobbyCore.PBLobbyCore
api-version: 1.16
authors: [Pablito]
description: A lobby management plugin.
softdepend:
  - WorldGuard
  - CMI
  - Essentials
  - EssentialsSpawn
  - EssentialsChat
  - Multiverse-Core
  - AuthMe
  - CombatLogX
  - DeluxeCombat
  - AAC
  - Spartan
load: POSTWORLD

commands:
  pblcore:
    description: Comandos de administración para el plugin.
    usage: /pblcore <command>
    permission: pblcore.admin
    aliases: [pblc, lc]
  lock:
    description: Bloquea el chat globalmente.
    permission: pblcore.chatlock.use
  unlock:
    description: Desbloquea el chat globalmente.
    permission: pblcore.chatlock.use
  announce:
    description: Send a global announce.
    usage: /<command> [message]
    permission: pblcore.command.announce
  broadcast:
    description: /announce Alias.
    usage: /<command> [message]
    permission: pblcore.command.announce
  pvp:
    description: Alterna tu estado de PvP (opt-in)
    usage: /<command> [on|off|status]
    permission: pblcore.pvp
  pvpdiag:
    description: Muestra el orden de listeners de daño
    permission: pblcore.pvp.diag
  hideplayers:
    description: Activa/desactiva el módulo de ocultar jugadores.
    usage: /<command> <on|off|toggle|status>
    permission: pblcore.hideplayers.admin
  hidebypass:
    description: Activa/desactiva tu bypass de ocultar jugadores (solo sesión).
    usage: /<command> <on|off|toggle|status>
    permission: pblcore.hideplayers.bypass.toggle

permissions:
  pblcore.admin:
    description: Permite recargar el plugin.
    default: op
  pblcore.chatlock.use:
    description: Permite bloquear y desbloquear el chat.
    default: op
  pblcore.chatlock.bypass:
    description: Permite hablar en el chat aunque esté bloqueado.
    default: op
  pblcore.pvp:
    default: true
  pblcore.pvp.bypass:
    default: op
  pblcore.pvp.diag:
    default: op
  pblcore.hideplayers.admin:
    description: Permite activar/desactivar el módulo de ocultar jugadores.
    default: op
  pblcore.hideplayers.bypass:
    description: Permite ser elegible para bypass (no ser ocultado / ver a todos) si lo activas con el comando.
    default: op
  pblcore.hideplayers.bypass.toggle:
    description: Permite usar /hidebypass.
    default: op
    children:
      pblcore.hideplayers.bypass: true
